services:
  - name: backend
    buildCommand: docker build -t backend backend
    startCommand: npm start
    environment:
      - DATABASE_DB=nsp_db
      - DATABASE_USER=root
      - DATABASE_PASSWORD=#NSP_2024
    env: true
    ports:
      - 8080
    automaticRestart: true
    healthCheckPath: /health
    dependencies:
      - name: db
        ports:
          - 3306
    private: true

  - name: db
    image: mariadb:10.11
    env: true
    ports:
      - 3306
    automaticRestart: true
    healthCheckPath: /health
    disk: 10
    private: true

  - name: frontend
    buildCommand: docker build -t frontend frontend
    startCommand: npm start
    ports:
      - 3000
    automaticRestart: true
    healthCheckPath: /health
    dependencies:
      - name: backend
        ports:
          - 8080
    private: false

volumes:
  - name: db_data
    mountPath: /var/lib/mysql

networks:
  - name: public
    visibility: public
  - name: private
    visibility: private
