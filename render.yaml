services:
  - name: backend
    buildCommand: cd backend && docker build -t backend .
    startCommand: docker run -e DATABASE_DB=nsp_db -e DATABASE_USER=root -e DATABASE_PASSWORD=#NSP_2024 -p 8080:8080 backend
    env:
      - key: NODE_ENV
        value: production
    healthCheckPath: /healthcheck
    envVars:
      - key: MYSQL_HOST
        fromDatabase:
          name: db
          property: internal-address

  - name: db
    image: mariadb:10.11
    env:
      - key: MYSQL_DATABASE
        value: nsp_db
      - key: MYSQL_USER
        value: root
      - key: MYSQL_ROOT_PASSWORD
        value: "#NSP_2024"
    disk:
      name: db-data
      mountPath: /var/lib/mysql

  - name: frontend
    buildCommand: cd frontend && docker build -t frontend .
    startCommand: docker run -p 3000:3000 frontend
    env:
      - key: NODE_ENV
        value: production
    healthCheckPath: /
